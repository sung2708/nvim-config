name: Portable Neovim config

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  startup:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: Validate Lua syntax and startup
        shell: pwsh
        run: |
          $env:XDG_CONFIG_HOME = Join-Path $env:RUNNER_TEMP "xdg/config"
          $env:XDG_DATA_HOME = Join-Path $env:RUNNER_TEMP "xdg/data"
          $env:XDG_STATE_HOME = Join-Path $env:RUNNER_TEMP "xdg/state"
          $env:XDG_CACHE_HOME = Join-Path $env:RUNNER_TEMP "xdg/cache"
          $configPath = Join-Path $env:XDG_CONFIG_HOME "nvim"

          New-Item -ItemType Directory -Force $env:XDG_CONFIG_HOME | Out-Null
          Copy-Item -Recurse -Force $env:GITHUB_WORKSPACE $configPath

          nvim --headless --clean -u NONE "+lua local root=vim.fs.joinpath(vim.env.GITHUB_WORKSPACE, 'lua'); for name in vim.fs.dir(root, { depth = math.huge }) do if name:match('%.lua$') then assert(loadfile(vim.fs.joinpath(root, name))) end end" +qa
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          nvim --headless "+Lazy! sync" +qa
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          nvim --headless "+Lazy! load codecompanion.nvim" "+Lazy! load render-markdown.nvim" "+lua local ok,err=pcall(function() local config=require('codecompanion.config'); local adapter=require('codecompanion.adapters').resolve('codex'); local selection=require('integrations.codecompanion'); local items=require('codecompanion.action_palette').get_cached_items({mode='v'}); local seen={}; for _,item in ipairs(items) do seen[item.name]=true end; local function map_desc(lhs,mode) return vim.fn.maparg(lhs,mode,false,true).desc end; assert(vim.fn.exists(':CodeCompanionChat') == 2); assert(vim.fn.exists(':CodeCompanionCodeReview') == 2); assert(vim.fn.exists(':DiffviewOpen') == 2); assert(vim.fn.exists(':PasteImage') == 2); assert(require('nui.input')); assert(require('nui.menu')); assert(adapter.type == 'acp'); assert(adapter.defaults.auth_method == 'chat-gpt'); assert(adapter.defaults.mcpServers == 'inherit_from_config'); assert(config.interactions.chat.opts.completion_provider == 'blink'); assert(config.interactions.chat.slash_commands.buffer.opts.provider == 'fzf_lua'); assert(config.interactions.chat.slash_commands.image.opts.provider == 'snacks'); assert(config.interactions.chat.slash_commands.buffer.keymaps.modes.n == '<leader>ab'); assert(config.interactions.chat.keymaps.copilot_stats == nil); assert(config.interactions.shared.keymaps.view_diff.modes.n == '<leader>ad'); assert(config.display.action_palette.opts.show_preset_prompts == false); assert(config.rules.opts.chat.autoload_groups_in_prompt_library == true); assert(config.prompt_library['Generate tests (chat)'].interaction == 'chat'); assert(config.prompt_library['Selection code workflow'].interaction == 'workflow'); assert(config.prompt_library['Commit message'].opts.alias == 'commit'); assert(type(selection.selection_menu) == 'function'); assert(type(selection.ask_selection) == 'function'); assert(seen['Explain selection']); assert(seen['Generate tests (chat)']); assert(seen['Selection code workflow']); assert(not seen['Inline prompt']); assert(not seen['Unit tests']); assert(type(config.interactions.code_review.display.diff.provider) == 'function'); assert(map_desc('<Space>aa','n') == 'CodeCompanion: Actions'); assert(map_desc('<Space>aa','v') == 'CodeCompanion: Add Selection'); assert(map_desc('<Space>am','v') == 'CodeCompanion: Selection Menu'); assert(map_desc('<Space>aq','v') == 'CodeCompanion: Ask Selection'); assert(map_desc('<Space>ae','v') == 'CodeCompanion: Explain Selection'); assert(map_desc('<Space>af','v') == 'CodeCompanion: Fix Selection'); assert(map_desc('<Space>al','v') == 'CodeCompanion: Explain Selection Diagnostics'); assert(map_desc('<Space>at','v') == 'CodeCompanion: Generate Selection Tests'); assert(map_desc('<Space>aR','v') == 'CodeCompanion: Refactor Selection'); assert(map_desc('<Space>ac','n') == 'CodeCompanion: Review Comment'); assert(map_desc('<Space>av','n') == 'CodeCompanion: Review Agent Changes'); assert(map_desc('<Space>aV','n') == 'CodeCompanion: Review All Changes'); assert(map_desc('<Space>ax','n') == 'CodeCompanion: Changed Files'); assert(vim.tbl_contains(require('render-markdown.state').file_types, 'codecompanion')) end); if not ok then vim.api.nvim_err_writeln(err); vim.cmd('cquit 1') end" +qa
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          nvim --headless "+lua assert(vim.fn.exists(':ConfigHealth') == 2)" "+checkhealth config" +qa
          exit $LASTEXITCODE
